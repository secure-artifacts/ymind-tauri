name: Release YMind Pro

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  # 阶段 1：多平台并发编译并暂存产物
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            targets: 'x86_64-unknown-linux-gnu'
            args: ''
          - os: windows-latest
            targets: 'x86_64-pc-windows-msvc'
            args: ''
          - os: macos-latest
            targets: 'aarch64-apple-darwin, x86_64-apple-darwin'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      # 兼容 Ubuntu 22.04 / 24.04+ 依赖
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          if grep -qE "24\.|noble" /etc/os-release; then
            echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee /etc/apt/sources.list.d/jammy.list
          fi
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            file \
            wget \
            curl
          sudo rm -f /etc/apt/sources.list.d/jammy.list || true
          sudo apt-get update || true

      # 修复：全局安装指定版本的 Tauri v1 CLI（无需 package.json）
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^1.6.0

      # 编译各平台安装包
      - name: Build Tauri app
        run: tauri build ${{ matrix.args }}

      # 暂存各端安装包
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  # 阶段 2：三端编译完成后，单任务一次性签名并发版
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # 为所有平台的安装包生成 Attestation 安全证明
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/*.msi
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.deb
            release-assets/*.AppImage

      # 原子化一次性创建 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.msi
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.deb
            release-assets/*.AppImage
          name: 'YMind Pro ${{ github.ref_name }}'
          draft: false
          prerelease: false