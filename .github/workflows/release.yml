name: Release YMind Pro

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  # 阶段 1：多平台并发编译并暂存产物
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            targets: 'x86_64-unknown-linux-gnu'
            args: ''
          - os: windows-latest
            targets: 'x86_64-pc-windows-msvc'
            args: ''
          - os: macos-latest
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      # Linux (Ubuntu 24.04) 原生安装 Tauri v2 依赖
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            file \
            wget \
            curl

      # 升级为 Tauri v2 CLI
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2.0.0

      - name: Install Frontend Dependencies
        run: npm install || true

      - name: Build Tauri app
        run: tauri build ${{ matrix.args }}

      # 暂存各端安装包
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  # 阶段 2：三端编译完成后，单任务一次性签名并发版
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw-artifacts
          merge-multiple: true

      # 关键步骤：把所有深层子文件夹里的 deb/exe/dmg 提取到 flat 目录
      - name: Prepare and flatten release assets
        run: |
          mkdir -p release-assets
          find raw-artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \) -exec cp {} release-assets/ \;
          echo "=== 即将发布的文件列表 ==="
          ls -lh release-assets/

      # 对提取出来的安装包做 Attestation 签名
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-assets/*'

      # 发布到 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 'release-assets/*'
          name: 'YMind Pro ${{ github.ref_name }}'
          draft: false
          prerelease: false