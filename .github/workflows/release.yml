name: Release YMind Pro

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            targets: 'x86_64-unknown-linux-gnu'
            args: ''
          - os: windows-latest
            targets: 'x86_64-pc-windows-msvc'
            args: ''
          - os: macos-latest
            # 修复：同时安装两个标准架构
            targets: 'aarch64-apple-darwin, x86_64-apple-darwin'
            # 传参给 tauri-action 进行 universal 合并
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      # 兼容 Ubuntu 22.04 / 24.04+ 的依赖
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          if grep -qE "24\.|noble" /etc/os-release; then
            echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee /etc/apt/sources.list.d/jammy.list
          fi
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            file \
            wget \
            curl
          sudo rm -f /etc/apt/sources.list.d/jammy.list || true
          sudo apt-get update || true

      - name: Install frontend dependencies
        run: npm install || true

      # 执行 Tauri 构建并传入平台对应参数
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'YMind Pro ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 为各平台安装包生成 Attestation 安全证明
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg