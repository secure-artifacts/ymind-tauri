[package]
name = "ymind-pro"
version = "1.0.0"
description = "YMind Pro - Apple-styled Mind Mapping & Outliner Studio"
authors = ["Your Name"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"

[features]
default = []
